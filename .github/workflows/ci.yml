name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for common secret patterns
        shell: bash
        run: |
          set -euo pipefail

          pattern='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk_(live|test)_[0-9A-Za-z]{20,}|ghp_[0-9A-Za-z_]{36,}|github_pat_[0-9A-Za-z_]{22,}|-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----|([Aa][Pp][Ii][_-]?[Kk][Ee][Yy]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd])[[:space:]]*[:=])'

          if git grep -nIE "$pattern" -- . \
            ':(exclude).github/workflows/*' \
            ':(exclude)build/*' \
            ':(exclude)docs/html/*' \
            ':(exclude)docs/docs/html/*'; then
            echo "Potential secret detected."
            exit 1
          fi

          echo "No obvious secrets detected."

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check tools

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - python-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure debug build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug

      - name: Build debug target
        run: cmake --build build-ci --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Configure warning build
        run: cmake -S . -B build-warnings -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"

      - name: Build warning target
        run: cmake --build build-warnings --parallel 2

      - name: Run grayscale CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/build-ci/jpeg_cli" "$GITHUB_WORKSPACE/lenna.img" 75
          "$GITHUB_WORKSPACE/build-ci/jpeg_cli" --decompress lenna.huff
          cmp -s recon_lenna.pgm decomp_lenna.pgm

      - name: Run color CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/build-ci/jpeg_cli" --color-compress "$GITHUB_WORKSPACE/tests/sample_color.ppm" tmp_cli_color 90 444
          "$GITHUB_WORKSPACE/build-ci/jpeg_cli" --color-decompress tmp_cli_color tmp_cli_color_out.ppm
          test -s tmp_cli_color_out.ppm
